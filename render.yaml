
services:
  - type: web
    name: roblox-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_TOKEN
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
